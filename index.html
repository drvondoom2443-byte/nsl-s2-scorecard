<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSL S2 - Nawab Super League Season 2</title>

  <!-- Google Fonts: Teko (Sports Display) & Inter (Clean Data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheet (Championship Velocity Design System) -->
  <link rel="stylesheet" href="css/styles.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Teko', 'sans-serif']
          },
          colors: {
            brand: {
              emerald: '#00F5A0',
              gold: '#FFB800',
              crimson: '#FF2A6D',
              dark: '#060A12',
              card: '#0E1728'
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#060A12] text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">

  <!-- Main Top Header -->
  <header class="sticky top-0 z-40 bg-[#0E1728]/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-2.5 flex items-center justify-between shadow-xl">
    <!-- Brand Title -->
    <div class="flex items-center space-x-2.5 cursor-pointer" onclick="window.App.navigate('home')">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 p-0.5 shadow-md shadow-emerald-500/20 shrink-0">
        <div class="w-full h-full bg-[#0E1728] rounded-[10px] flex items-center justify-center font-display text-emerald-400 font-black text-lg">
          NSL
        </div>
      </div>
      <div>
        <div class="flex items-center space-x-1.5">
          <span class="font-display text-2xl tracking-wider font-black bg-gradient-to-r from-emerald-400 via-teal-200 to-emerald-500 bg-clip-text text-transparent">
            NSL S2
          </span>
          <span class="text-[9px] px-1.5 py-0.2 rounded-full bg-emerald-500/10 text-emerald-400 font-extrabold border border-emerald-500/30">
            TAPE-BALL
          </span>
        </div>
        <p class="text-[10px] text-slate-400 -mt-1 font-medium">Nawab Super League S2</p>
      </div>
    </div>

    <!-- Right Header Actions -->
    <div class="flex items-center space-x-2">
      <!-- Admin / Spectator Badge Toggle -->
      <button onclick="window.App.handleAdminToggleClick()" id="adminToggleBtn" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-xl text-xs font-bold border transition-all bg-slate-800 border-slate-700 text-slate-400 shadow-sm" title="Toggle Scorer / Spectator Mode">
        <i data-lucide="shield" class="w-3.5 h-3.5"></i>
        <span id="adminModeText">Spectator</span>
      </button>

      <!-- Quick Settings -->
      <button onclick="window.App.navigate('settings')" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300 shadow-sm">
        <i data-lucide="settings-2" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Live Mini Match Ticker (Appears globally when a match is running) -->
  <div id="globalLiveTicker" class="hidden bg-gradient-to-r from-rose-950/40 via-purple-950/40 to-slate-900 border-b border-rose-500/40 px-3.5 py-2 cursor-pointer transition-all" onclick="window.App.navigate('live')">
    <div class="max-w-2xl mx-auto flex items-center justify-between text-xs">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
        <span class="font-bold text-rose-400 font-display text-sm uppercase tracking-wider" id="tickerMatchTitle">LIVE MATCH</span>
      </div>
      <div class="font-bold text-white font-mono text-sm" id="tickerScoreSummary">0/0 (0.0 ov)</div>
      <div class="text-[11px] text-emerald-400 font-bold flex items-center gap-0.5">Scorer Console &rarr;</div>
    </div>
  </div>

  <!-- Primary Dynamic Content Area -->
  <main id="appContent" class="flex-1 max-w-2xl w-full mx-auto p-4 pb-24 overflow-x-hidden"></main>

  <!-- Bottom Navigation Bar (Refactored to 5 High-Visibility, Thumb-Friendly Zones) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#0E1728]/95 backdrop-blur-xl border-t border-slate-800/90 py-1.5 px-3 shadow-2xl">
    <div class="max-w-md mx-auto grid grid-cols-5 gap-1">
      <button onclick="window.App.navigate('home')" id="nav-home" class="flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400 hover:text-emerald-400 transition-colors">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5 font-bold">Home</span>
      </button>

      <button onclick="window.App.navigate('live')" id="nav-live" class="flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400 hover:text-emerald-400 transition-colors relative">
        <i data-lucide="radio" class="w-5 h-5 text-rose-500"></i>
        <span id="navLiveDot" class="hidden absolute top-1 right-5 w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
        <span class="text-[10px] mt-0.5 font-bold">Live</span>
      </button>

      <button onclick="window.App.navigate('fixtures')" id="nav-fixtures" class="flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400 hover:text-emerald-400 transition-colors">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5 font-bold">Fixtures</span>
      </button>

      <button onclick="window.App.navigate('standings')" id="nav-standings" class="flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400 hover:text-emerald-400 transition-colors">
        <i data-lucide="trophy" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5 font-bold">Standings</span>
      </button>

      <button onclick="window.App.navigate('awards')" id="nav-awards" class="flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400 hover:text-emerald-400 transition-colors">
        <i data-lucide="award" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5 font-bold">Caps</span>
      </button>
    </div>
  </nav>

  <!-- Universal Modal Container -->
  <div id="modalContainer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 overflow-y-auto"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
